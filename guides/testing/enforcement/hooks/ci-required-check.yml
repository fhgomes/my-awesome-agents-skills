# ci-required-check.yml — the layer that does not care which tool or human made the change.
#
# INSTALL: copy to .github/workflows/ci-required-check.yml, delete the jobs your repo
# does not have, then make the LAST job ("required") a required status check:
#   GitHub -> Settings -> Rules -> Rulesets -> New branch ruleset (or Settings ->
#   Branches -> Add branch protection rule) -> target the default branch ->
#   "Require status checks to pass" -> add "required" -> save.
#   Leave "Do not allow bypassing the above settings" ON. An admin bypass turns the
#   only guarantee in the stack back into a convention.
# Verified against https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions on 2026-09-07.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest   # Docker is present, so Testcontainers works with no service block
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # cleanTest is not optional: without it Gradle can report BUILD SUCCESSFUL in
      # seconds because every test task was UP-TO-DATE. A gate that finishes
      # suspiciously fast has not passed, it has abstained.
      - run: ./gradlew cleanTest compileJava compileTestJava test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-report
          path: '**/build/reports/tests/test'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      # Coverage ratchet: thresholds live in vitest.config.ts and only ever go up.
      # Coverage is a floor on new code, never a target.

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble   # pin to your @playwright/test version
    env:
      CI: '1'          # forbidOnly: !!process.env.CI — a committed .only fails the run
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Start the stack under test here (docker compose up -d, or a dev server with
      # `wait-on`), so BASE_URL answers before the first spec. Never point CI at a
      # shared or production host; the suite's prod guard would refuse anyway.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  spec-guard:
    # Catches what a local hook cannot: a feat/fix pushed with --no-verify, or made
    # from a clone that never installed the hooks, or by a cloud agent that has none.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # scripts/git-hooks/commit-msg is require-spec-for-feature.sh, copied there by the
      # recipe in ../README.md section 5(b). Adjust the path if you keep it elsewhere.
      - run: chmod +x scripts/git-hooks/commit-msg
      - name: Every feat/fix in this PR ships a test
        run: |
          scripts/git-hooks/commit-msg \
            --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  required:
    # The single check to mark required in branch protection. Adding a job above
    # without adding it to `needs` here silently removes it from the gate.
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, spec-guard]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          echo "e2e=${{ needs.e2e.result }} spec-guard=${{ needs.spec-guard.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
