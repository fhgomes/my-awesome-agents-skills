<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck title</title>
<!--
  slides-html deck skeleton. Copy this file, keep every block marked KEEP,
  replace the THEME block with the chosen design system and write the slides.
  Author everything at 1920×1080; the stage scales as a whole (never reflow).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =============================================================
   THEME — replace with the design system's :root block
   ============================================================= */
:root {
  --stage-bg: #000;                 /* letterbox color outside the stage */
  --slide-bg: #05061a;              /* fallback under the background image */
  --bg-image: url("assets/bg-navy.png");
  --card-bg: rgba(0, 0, 24, 0.75);
  --card-border: rgba(230, 230, 230, 0.25);
  --card-blur: blur(20px) saturate(170%);
  --surface: #0d0d25;
  --surface-muted: #0f163e;
  --box-bg: #182567;
  --box-border: #313e80;
  --heading: #ffffff;
  --body: #cfd0d8;
  --body-muted: rgba(207, 208, 216, 0.5);
  --accent: #5a6ed8;
  --accent-dim: #7387f1;
  --amber: #f59e0b;
  --cyan: #06b6d4;
  --pink: #f20374;
  --violet: #8b5cf6;
  --slate: #94a3b8;
  --font-heading: 'Roboto', sans-serif;
  --font-body: 'Roboto', sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

/* =============================================================
   KEEP — fixed 16:9 stage (viewport-base.css, MIT frontend-slides)
   ============================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
.deck-controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; }
@media print {
  html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
  .deck-viewport { position: static; overflow: visible; background: #fff; }
  .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
  .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1920px; height: 1080px; break-after: page; page-break-after: always; }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  .deck-controls { display: none !important; }
  .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* =============================================================
   KEEP — entrance animation (blocks fade up on the active slide)
   ============================================================= */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 1s var(--ease-out), transform 1s var(--ease-out); }
.slide.visible .reveal { opacity: 1; transform: translateY(0); }
.reveal:nth-child(2) { transition-delay: .15s; } .reveal:nth-child(3) { transition-delay: .30s; }
.reveal:nth-child(4) { transition-delay: .45s; } .reveal:nth-child(5) { transition-delay: .60s; }
.reveal:nth-child(6) { transition-delay: .75s; }

/* =============================================================
   KEEP — deck chrome (outside the design system)
   ============================================================= */
.deck-controls { font: 500 14px/1 system-ui, sans-serif; color: rgba(255,255,255,.55); letter-spacing: .04em; opacity: 0; transition: opacity .4s; user-select: none; }
.deck-controls.show { opacity: 1; }

/* =============================================================
   DESIGN SYSTEM — components (example: nightsky-java; replace)
   ============================================================= */
.slide { background: var(--slide-bg) var(--bg-image) center / cover no-repeat; font-family: var(--font-body); color: var(--body); }
.card { position: absolute; inset: 40px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--card-border);
        backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
        padding: 72px 80px; display: flex; flex-direction: column; justify-content: center; gap: 32px; overflow: hidden; }
.card.top { justify-content: flex-start; }
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 500; color: var(--heading); line-height: 1.25; }
h1 { font-size: 62px; } h1.cover { font-size: 78px; line-height: 1.15; } h2 { font-size: 48px; } h3 { font-size: 30px; line-height: 1.3; } h4 { font-size: 26px; line-height: 1.3; }
p, li { font-size: 32px; line-height: 1.6; } .sm { font-size: 26px; } .caption { font-size: 21px; color: var(--body-muted); }
.eyebrow { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.amber { color: var(--amber); } .cyan { color: var(--cyan); } .pink { color: var(--pink); } .violet { color: var(--violet); } .slate { color: var(--slate); }
.cols { display: grid; gap: 48px; align-items: center; }
.cols.c-62-38 { grid-template-columns: 62fr 38fr; } .cols.c-50-50 { grid-template-columns: 1fr 1fr; } .cols.c-79-21 { grid-template-columns: 79fr 21fr; }
.grid-2x3, .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.lanes-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
blockquote { font-size: 36px; line-height: 1.4; color: var(--heading); border-left: 6px solid var(--accent); padding-left: 28px; }
blockquote + .caption { margin-top: 12px; }
.display { font-size: 64px; font-weight: 500; line-height: 1.1; color: var(--amber); }
.box { background: var(--box-bg); border: 1px solid var(--box-border); border-radius: 12px; padding: 24px 28px; }
.box p { font-size: 26px; }
.lane { background: var(--surface-muted); border: 1px solid var(--box-border); border-left: 6px solid var(--accent); border-radius: 12px; padding: 24px 28px; }
.lane.cyan { border-left-color: var(--cyan); } .lane.amber { border-left-color: var(--amber); }
.lane.violet { border-left-color: var(--violet); } .lane.pink { border-left-color: var(--pink); }
.callout { background: var(--box-bg); border-radius: 12px; padding: 24px 28px; display: flex; gap: 20px; align-items: flex-start; }
.callout::before { content: "💬"; font-size: 28px; line-height: 1.3; }
pre.code { background: var(--surface); border-radius: 12px; padding: 26px 32px; font: 400 24px/1.5 var(--font-mono); color: #e6edf3; white-space: pre; overflow: hidden; }
pre.code .k { color: #ff7b72; } pre.code .t { color: #d2a8ff; } pre.code .b { color: #ffa657; } pre.code .n { color: #79c0ff; } pre.code .s { color: #a5d6ff; } pre.code .c { color: #8b949e; } pre.code .f { color: #7ee787; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; font-size: 26px; }
th { text-align: left; font-weight: 500; font-size: 21px; color: var(--body); padding: 16px 24px; border-bottom: 1px solid var(--box-border); }
td { padding: 16px 24px; border-bottom: 1px solid var(--box-border); vertical-align: top; }
tr.hl td { background: var(--cyan); color: #04202a; }
.num { width: 26px; text-align: right; } td.r { text-align: right; }
.pill { display: inline-block; background: var(--accent); color: var(--body); border-radius: 999px; padding: 6px 14px; font-size: 20px; text-transform: uppercase; }
.pill.cyan { background: var(--cyan); color: #04202a; }
.step { display: grid; grid-template-columns: 56px 1fr; gap: 20px; align-items: stretch; }
.step .n { width: 56px; height: 56px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 500; }
.mascot { position: absolute; right: 60px; bottom: 60px; height: 300px; }
.qr { background: #fff; border-radius: 12px; padding: 20px; display: inline-block; }
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">

    <!-- ===== 1. COVER ===== -->
    <section class="slide" data-label="Cover">
      <div class="card">
        <div class="cols c-62-38">
          <div>
            <h1 class="cover reveal">Deck title goes here</h1>
            <p class="reveal" style="margin-top:24px">One-line subtitle. Lessons from a real product.</p>
            <p class="reveal" style="margin-top:40px">Author · <span class="amber">@handle</span></p>
          </div>
          <pre class="code reveal">project/
├─ Service.java
└─ config.json</pre>
        </div>
      </div>
    </section>

    <!-- ===== 2. CONTENT (title + body) ===== -->
    <section class="slide" data-label="Concept">
      <div class="card top">
        <h1 class="reveal">Slide title with <span class="amber">one</span> emphasized word</h1>
        <p class="reveal">Body text at 32px. Keep to two or three lines; split the slide if it grows.</p>
      </div>
    </section>

  </main>
</div>
<div class="deck-controls" id="deckControls">1 / 2 · ← → · F fullscreen · P print</div>

<script>
/* =============================================================
   KEEP — SlidePresentation controller
   ============================================================= */
class SlidePresentation {
  constructor() {
    this.slides = [...document.querySelectorAll('.slide')];
    this.stage = document.getElementById('deckStage');
    this.controls = document.getElementById('deckControls');
    this.i = 0;
    this.scale(); window.addEventListener('resize', () => this.scale());
    document.addEventListener('keydown', e => this.onKey(e));
    this.touch();
    let wheelLock = 0;
    window.addEventListener('wheel', e => { const t = Date.now(); if (t - wheelLock < 700) return; wheelLock = t; this.go(this.i + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
    const fromHash = () => { const n = parseInt((location.hash || '').replace('#', ''), 10); return Number.isFinite(n) && n > 0 ? n - 1 : 0; };
    this.show(fromHash());
    window.addEventListener('hashchange', () => { if (fromHash() !== this.i) this.go(fromHash()); });
    let hide; const peek = () => { this.controls.classList.add('show'); clearTimeout(hide); hide = setTimeout(() => this.controls.classList.remove('show'), 1800); };
    window.addEventListener('mousemove', peek); peek();
  }
  scale() {
    const f = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    const x = (window.innerWidth - 1920 * f) / 2, y = (window.innerHeight - 1080 * f) / 2;
    this.stage.style.transform = `translate(${x}px, ${y}px) scale(${f})`;
  }
  onKey(e) {
    if (e.target.isContentEditable) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); this.go(this.i + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); this.go(this.i - 1); }
    else if (k === 'Home') this.go(0);
    else if (k === 'End') this.go(this.slides.length - 1);
    else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    else if (k === 'p' || k === 'P') window.print();
    else if (/^[0-9]$/.test(k)) { this.typed = (this.typed || '') + k; clearTimeout(this.typedT); this.typedT = setTimeout(() => { this.go(parseInt(this.typed, 10) - 1); this.typed = ''; }, 500); }
  }
  touch() {
    let x0 = null;
    window.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    window.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) this.go(this.i + (dx < 0 ? 1 : -1)); else this.go(this.i + 1); x0 = null; }, { passive: true });
  }
  go(n) { this.show(Math.max(0, Math.min(n, this.slides.length - 1))); }
  show(n) {
    this.i = n;
    this.slides.forEach((s, k) => { s.classList.toggle('active', k === n); s.classList.toggle('visible', k === n); });
    history.replaceState(null, '', '#' + (n + 1));
    this.controls.textContent = `${n + 1} / ${this.slides.length} · ← → · F fullscreen · P print`;
    document.dispatchEvent(new CustomEvent('slidechange', { detail: { index: n, total: this.slides.length } }));
  }
}
new SlidePresentation();
</script>
</body>
</html>
